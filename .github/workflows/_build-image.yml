name: Build Image

# Reusable: builds a service image and pushes it to GHCR as :<commit sha> and
# :<channel>. Deploys pull the commit tag, which never moves.
on:
  workflow_call:
    inputs:
      image:
        description: GHCR image name, without a tag.
        required: true
        type: string
      dockerfile:
        description: Dockerfile path from the repo root.
        required: true
        type: string
      channel:
        description: Moving tag to push alongside the commit tag (preview or production).
        required: true
        type: string
      cache-scope:
        description: Buildx GHA cache scope. One per image, so images do not evict each other.
        required: true
        type: string
    outputs:
      tag:
        description: The immutable tag that was pushed.
        value: ${{ jobs.build.outputs.tag }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ inputs.image }}:${{ inputs.channel }}
            ${{ inputs.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.cache-scope }}
          cache-to: type=gha,mode=max,scope=${{ inputs.cache-scope }}
