name: Deploy Team Bot

on:
  push:
    branches:
      - main
    paths:
      - 'services/team-bot/**'
      - 'packages/shared/**'
      - 'tooling/typescript-config/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.pnpmfile.cjs'
      - '.dockerignore'
      - '.github/workflows/deploy-team-bot.yml'
      - '.github/workflows/_build-image.yml'
      - '.github/workflows/_deploy-image.yml'
  # First deploy, or redeploying after changing secrets in the infra repo.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Queue deploys instead of running them side by side, so an older run can
# never finish after a newer one.
concurrency:
  group: deploy-team-bot
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'Virtality-app/virtality-platform'
    uses: ./.github/workflows/_build-image.yml
    with:
      image: ghcr.io/virtality-app/virtality-team-bot
      dockerfile: services/team-bot/Dockerfile
      channel: production
      cache-scope: team-bot

  deploy:
    needs: build
    uses: ./.github/workflows/_deploy-image.yml
    with:
      image: ghcr.io/virtality-app/virtality-team-bot
      tag: ${{ needs.build.outputs.tag }}
      infra-command: team-bot-up
      tag-variable: TEAM_BOT_TAG
      container: virtality_team_bot
